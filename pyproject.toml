[project]
name = "fast-aws"
version = "0.1.0"
description = "Fast TUI browser for AWS resources using local profiles & SSO"
readme = "README.md"
authors = [
    { name = "pavitra-infocusp", email = "pavitra@infocusp.com" }
]
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.61",
    "textual>=8.2.8",
]

[project.scripts]
fast-aws = "fast_aws.cli:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "textual-dev>=1.8.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "B008",  # function call in default argument (Textual common pattern)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]
